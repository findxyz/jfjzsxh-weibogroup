<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微博群聊消息查看器</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <div id="topbar">
    <label class="field-label">群：<select id="group-select" title="选择群"></select></label>
    <label class="field-label">成员：<select id="member-select" title="按成员过滤"><option value="">全部成员</option></select></label>
    <button id="search-btn" type="button" title="打开发送者 / 关键词搜索">🔍 高级搜索</button>
    <a href="/export.html" class="nav-link-btn" title="数据导出">📤 数据导出</a>
    <button id="sync-btn" type="button" title="增量同步新消息">🔄 同步</button>
    <label id="auto-refresh-toggle" class="ar-toggle" title="每分钟自动同步一次">
      <input type="checkbox" id="auto-refresh-check">
      <span class="ar-track"><span class="ar-thumb"></span></span>
      <span class="ar-label">自动同步</span>
      <div id="auto-refresh-countdown" class="ar-countdown" aria-hidden="true" title="距下次同步 60s"></div>
    </label>
    <span id="status">加载中…</span>
  </div>

  <!-- 续期弹窗（Cookie 过期时自动弹出，仅提供一键续期） -->
  <div id="renew-modal" class="renew-modal" hidden>
    <div class="rm-backdrop"></div>
    <div class="rm-dialog" role="dialog" aria-modal="true">
      <button class="rm-close" type="button" title="关闭" id="renew-modal-close">×</button>
      <div class="rm-title" id="renew-modal-title">登录已过期</div>
      <p class="rm-desc" id="renew-modal-desc">Cookie 已失效，无法同步新消息。点击下方按钮即可重新登录。</p>

      <!-- 初始态：一键续期按钮 -->
      <div id="renew-intro" class="rm-intro">
        <button id="renew-start-btn" type="button" class="primary-btn rm-start">一键续期并登录</button>
      </div>

      <!-- 续期中：放大的二维码 + 状态 -->
      <div id="renew-scan" class="rm-scan" hidden>
        <div class="rm-qr-wrap">
          <img id="renew-qr-img" alt="请使用微博 APP 扫码" class="rm-qr-img">
        </div>
        <div class="rm-renew-status" id="renew-status">正在生成二维码…</div>
        <button id="renew-stop-btn" type="button" class="ghost-btn" hidden>取消续期</button>
      </div>
    </div>
  </div>

  <div id="main">
    <aside id="sidebar">
      <div id="date-jump">
        <label class="field-label">跳转日期：<input id="date-picker" type="date"></label>
      </div>
      <div id="date-list"></div>
    </aside>

    <section id="viewer">
      <div id="range-indicator"></div>
      <div id="message-list">
        <div id="sentinel-top"></div>
        <div id="sentinel-bottom"></div>
      </div>
      <div id="empty-hint" hidden></div>
    </section>
  </div>

  <!-- 高级搜索浮层 -->
  <div id="search-overlay" hidden>
    <div id="search-panel">
      <div id="search-panel-head">
        <span>高级搜索</span>
        <button id="search-close" type="button">×</button>
      </div>
      <div class="search-fields">
        <input id="search-sender" type="search" placeholder="发送者名称（精确匹配，可选）" autocomplete="off">
        <input id="search-keyword" type="search" placeholder="关键词（模糊匹配，可选）" autocomplete="off">
        <button id="search-submit" type="button">搜索</button>
      </div>
      <div class="search-fields">
        <label class="field-label">起止日期：
          <input id="search-start" type="date">
          <span class="date-sep-inline">至</span>
          <input id="search-end" type="date">
        </label>
      </div>
      <div id="search-status"></div>
      <div id="search-results"></div>
    </div>
  </div>

  <!-- 图片/视频放大查看 -->
  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button class="lightbox-close" type="button" title="关闭">×</button>
      <div class="lightbox-stage"></div>
      <div class="lightbox-status"></div>
    </div>
  </div>

  <script src="/web/app.js"></script>
</body>
</html>
